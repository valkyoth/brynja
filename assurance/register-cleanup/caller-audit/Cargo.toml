[workspace]

[package]
name = "brynja-caller-residue-audit"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
scoped = []
higher = []
accelerated = ["higher", "brynja-crypto-cpu/hardened-execution", "brynja-mac-kmac/hardened-execution", "brynja-hash-tuple/hardened-execution", "brynja-hash-parallel/hardened-execution"]

[dependencies]
brynja-crypto-cpu = { path = "../../../crates/brynja-crypto-cpu", default-features = false }
brynja-mac-kmac = { path = "../../../crates/brynja-mac-kmac", default-features = false }
brynja-hash-tuple = { path = "../../../crates/brynja-hash-tuple", default-features = false }
brynja-hash-parallel = { path = "../../../crates/brynja-hash-parallel", default-features = false }
brynja-hash-sha2 = { path = "../../../crates/brynja-hash-sha2", default-features = false }
brynja-hash-sha3 = { path = "../../../crates/brynja-hash-sha3", default-features = false }
brynja-legacy-sha1 = { path = "../../../crates/brynja-legacy-sha1", default-features = false }
brynja-legacy-md5 = { path = "../../../crates/brynja-legacy-md5", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
