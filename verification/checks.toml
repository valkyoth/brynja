platform = "linux-x86_64"
timeout_seconds = 1800
[checks.success]
contains = ["test result: ok. 10 passed; 0 failed; 0 ignored;"]
minimum_tests = 10
exact_tests = 10
unique_lines = ["AES_KERNEL_KAT_PASS: 128:568","AES_KERNEL_KAT_PASS: 192:700","AES_KERNEL_KAT_PASS: 256:810","AES_KERNEL_ALIGNMENT_PASS: 768","AES_EXPANSION_KAT_PASS: 128:568","AES_EXPANSION_KAT_PASS: 192:700","AES_EXPANSION_KAT_PASS: 256:810","AES_EXPANSION_ALIGNMENT_PASS: 768","AES_EXPANSION_GENERATED_PASS: 774","AES_EXPANSION_DOMAIN_PASS: 3 valid shapes; 5 rejected shapes; no_std","AES_EXPANSION_CANDIDATE_PASS: 1.90.0 x86; correctness only; not public admission"]

