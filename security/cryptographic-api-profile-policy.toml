[secret-template.private-key]
fields = ["private-key", "public-key-binding", "operation-state", "phase"]
temporaries = ["nonce-or-blinding", "scalar-or-exponent", "shared-secret", "signature-staging", "output-staging"]
secret_output_classification = "typed-secret-owned"

[secret-template.encoded-secret]
fields = ["encoded-secret", "decode-state", "phase"]
temporaries = ["decoded-key", "password-material", "decryption-staging", "output-staging"]
secret_output_classification = "typed-secret-owned"

[secret-template.protocol-secret]
