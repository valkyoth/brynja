[package]
name = "chacha20poly1305-rfc-replay"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[features]
paired-x86 = ["brynja-aead-chacha20poly1305/chacha20poly1305-x86"]

[[example]]
name = "paired_throughput"
required-features = ["paired-x86"]

[dependencies]
brynja-aead-chacha20poly1305 = { path = "../../crates/brynja-aead-chacha20poly1305" }
brynja-cipher-chacha = { path = "../../crates/brynja-cipher-chacha", features = ["hazmat-chacha20"] }
brynja-mac-poly1305 = { path = "../../crates/brynja-mac-poly1305" }
