[workspace]

[package]
name = "brynja-sha3-cpu-candidate-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
brynja-crypto-cpu = { path = "../../crates/brynja-crypto-cpu", version = "=0.1.1" }
brynja-hash-sha3 = { path = "../../crates/brynja-hash-sha3", version = "=0.1.0" }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(brynja_cpu_evidence)'] }

[lints.clippy]
panic = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
undocumented_unsafe_blocks = "forbid"
