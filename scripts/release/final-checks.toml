# Finite AES-GCM and GMAC usability gate. Installed-consumer campaigns stay separate.
# No crates.io publication is selected for this internal milestone.
schema = 1
version = "0.29.4"
scope = "Packaged public API acceptance for Portable GMAC and Portable AES-GCM, plus explicit Linux/Windows x86-64 AES-NI/PCLMUL and Linux/macOS ARM64 AES/PMULL owners. Portable GHASH remains the default. Arm GHASH timing remains unresolved. RISC-V AES remains evidence-only and unadmitted. Internal only; no publication or implicit timing/proof/native campaign."
ci_checks = ["aes-gcm-package-controls","crypto-tests","crypto-lint","crypto-format","facade-integration","hkdf-owner-contract","aes-owner-contract","aes-wide-owner-contract","aes-wide-api","aes-dataflow-regressions","aes-provider-api","registry-tests","release-regressions","release-metadata","release-plan","workspace-metadata","api-profiles","api-profile-tests","requirements","requirement-domain-tests","protocol-surfaces","package-plan"]

[[checks]]
id = "gmac-public-consumer"
command = ["python3","scripts/gmac/check-consumer.py","public"]
timeout_seconds = 300

[[checks]]
id = "aes-gcm-package-controls"
command = ["python3","scripts/aes-gcm/test-packaged-api.py"]
timeout_seconds = 60

[[checks]]
id = "aead-packaged-endpoints"
command = ["python3","scripts/aes-gcm/check-portable-acceptance.py","--smoke"]
timeout_seconds = 600

