# Finite AES-family acceptance-candidate gate. Verification campaigns stay separate.
# No crates.io publication is selected for this internal milestone.
schema = 1
version = "0.27.4"
scope = "Evidence-only RISC-V AES candidate: QEMU functional observations, bounded linked-code reviews and unadmitted ordinary routes. Retain portable and admitted accelerated AES/provider contracts, downstream consumers and modern/legacy HKDF compatibility. Native RISC-V timing and physical qualification remain unavailable. Scoped pentest/retest required before release authorization; no historical evidence-freshness gate or implicit dynamic/proof/timing/compiler-matrix campaign."
ci_checks = ["crypto-tests","crypto-lint","crypto-format","facade-integration","hkdf-owner-contract","aes-owner-contract","aes-wide-owner-contract","aes-wide-api","aes-dataflow-regressions","aes-provider-api","registry-tests","release-regressions","release-metadata","release-plan","workspace-metadata","api-profiles","api-profile-tests","requirements","requirement-domain-tests","protocol-surfaces","package-plan"]

[[checks]]
id = "crypto-tests"
command = ["cargo","test","--locked","-p","brynja-crypto","-p","brynja-legacy-hkdf","--no-default-features","--features","brynja-crypto/hazmat-aes-block,brynja-crypto/external-key-provider"]
timeout_seconds = 300

[[checks]]
id = "crypto-lint"
command = ["cargo","clippy","--locked","-p","brynja-crypto","-p","brynja-legacy-hkdf","--no-default-features","--features","brynja-crypto/hazmat-aes-block,brynja-crypto/external-key-provider","--all-targets","--no-deps","--","-D","warnings"]
timeout_seconds = 300

[[checks]]
id = "crypto-format"
command = ["cargo","fmt","--package","brynja","--package","brynja-crypto","--package","brynja-legacy-hkdf","--check"]
timeout_seconds = 60

