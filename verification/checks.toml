[[checks]]
component = "aes"
id = "riscv-linked-msrv"
category = "aes-riscv-linked"
name = "Packaged RV64 LTO leaf bounds and cleanup on Rust 1.90.0"
establishes = "Four archive-only direct/facade abort/unwind consumers execute under QEMU. Actual ELF-byte bounded analysis of all six expansion/round leaf bodies checks public branches and addresses, initialized in-bounds byte accesses, exact read/write/AES-operation populations and scratch register clearing on nine public paths. Exact ELF-byte templates additionally bind the volatile byte-clear loop and two retained destruction functions, including their clear-target transfers. Six complete block-session bodies bind entry/postchecks, terminal quarantine, direction and matched-width leaf calls; the retained MSRV unwind call is bound to the live resume import. Six key-owner constructors bind entry clearing, rejection, expansion postchecks, scratch cleanup and successful ownership transfer, with width-specific expansion and named copy/fill imports. Six public-encryption boundaries bind staged output publication after postchecks, scratch cleanup and unchanged caller output on rejection for cached and ephemeral owners. Six secret-output bodies cover both directions: entry destination clearing, staged transforms through bound leaf/session targets, result gating, error/scratch cleanup and successful clearing-owner transfer. AES arithmetic opaque; no arbitrary-caller, timing, compiler-spill, physical-fault or native-admission claim."
command = ["python3","scripts/aes/check-aes-riscv-linked.py","--toolchain","1.90.0"]
cwd = "."
inputs = ["aes-build","aes-riscv-linked","aes-accelerated-linked","aes-accelerated-campaigns","aes-packaged","aes-avs","aes-packaged-differential","aes-differential-runner","hkdf-public-api-modern","compiler","hkdf-msrv","aes-riscv"]
environment = { RUSTUP_AUTO_INSTALL = "0" }
reject_environment = ["PYTHONOPTIMIZE","PYTHONPATH","RUSTFLAGS","CARGO_ENCODED_RUSTFLAGS","RUSTDOCFLAGS","RUSTC","RUSTDOC","RUSTC_WRAPPER","RUSTC_WORKSPACE_WRAPPER","CARGO_BUILD_TARGET","RUSTUP_TOOLCHAIN","CARGO_BUILD_RUSTFLAGS","CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUSTFLAGS","CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER","CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_RUNNER"]
platform = "linux-x86_64"
timeout_seconds = 1800
