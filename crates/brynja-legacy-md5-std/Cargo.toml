[package]
name = "brynja-legacy-md5-std"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in host detection and fail-closed selection for legacy MD5"
publish = ["crates-io"]

[features]
default = []
strict-execution = ["dep:brynja-core", "dep:brynja-crypto-cpu-std", "brynja-crypto-cpu-std/protected-memory"]
strict-acceleration = ["strict-execution", "brynja-legacy-md5/hardened-execution"]
runtime-execution = ["brynja-legacy-md5/execution"]
runtime-hardened-execution = ["brynja-legacy-md5/hardened-execution"]

[dependencies]
brynja-core = { workspace = true, optional = true }
brynja-crypto-cpu-std = { workspace = true, optional = true, default-features = true }
brynja-legacy-md5 = { path = "../brynja-legacy-md5", version = "=0.1.0", features = ["cpu"] }

[lints]
workspace = true
