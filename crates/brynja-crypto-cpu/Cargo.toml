[package]
name = "brynja-crypto-cpu"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional no_std CPU acceleration boundary for Brynja cryptography"
publish = ["crates-io"]
include = ["Cargo.toml","LICENSE-APACHE","LICENSE-MIT","README.md","src/**/*.rs"]

[features]
default = []
poly1305-avx2 = ["dep:brynja-core"]
poly1305-rvv = ["dep:brynja-core"]
poly1305-neon = ["dep:brynja-core"]
chacha20-sse2 = []
chacha20-neon = []
ghash-runtime-execution = []
aes-static-execution = []
aes-runtime-execution = ["aes-static-execution"]
sha256-hardened-batch = ["dep:brynja-core"]
sha512-hardened-batch = ["dep:brynja-core"]
keccak-hardened-batch = ["dep:brynja-core"]
keccak-batch = ["static-execution"]
sha512-batch = ["static-execution"]
sha256-batch = ["static-execution"]
static-execution = []
runtime-execution = ["static-execution"]
hardened-execution = ["static-execution", "dep:brynja-core"]

[dependencies]
brynja-core = { workspace = true, optional = true }

[lints]
workspace = true
