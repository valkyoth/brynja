[package]
name = "brynja-legacy-sha1-std"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Opt-in host detection and fail-closed selection for legacy SHA-1"
publish = ["crates-io"]

[features]
default = []
strict-execution = ["dep:brynja-core", "dep:brynja-crypto-cpu-std", "brynja-crypto-cpu-std/protected-memory"]
runtime-execution = ["brynja-legacy-sha1/execution"]
runtime-hardened-execution = ["runtime-execution", "brynja-legacy-sha1/hardened-execution"]

[dependencies]
brynja-core = { workspace = true, optional = true }
brynja-crypto-cpu-std = { workspace = true, optional = true }
brynja-legacy-sha1 = { path = "../brynja-legacy-sha1", version = "=0.1.0", features = ["cpu"] }

[lints]
workspace = true
