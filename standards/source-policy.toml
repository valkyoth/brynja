[review]
checked_at = "2026-09-06"
owner = "Brynja standards review"
pin_provenance = "Signed v0.3.2 baseline 00b1180a9014b7e69986e8ddd29d46e85a20aa2f; independently reverified 2026-07-30 against official RFC Editor, IANA, NIST, and ITU sources. The v0.3.5 review separately pinned final FIPS 203, SP 800-227, SP 800-90B, and SP 800-90C from official NIST publication bytes. Five newly reported RFC errata (9040, 9041, 9042, 9043, 9045) were reviewed and remain track-not-applied. On 2026-08-01 the official IANA HTML and XML were independently compared for the 2026-07-31 DNS Parameters update: Structured DNS Error allocations and its three new subregistries remain caller-owned at v0.188.0, and their provisional draft references cannot admit Brynja code; pins remain separate from every later refresh. On 2026-08-09 the official IANA XML and its SHA-256 were independently retrieved and reviewed: the TLS ExtensionType registry update dated 2026-08-07 adds only the `snifq/1` SNIF over QUIC ALPN entry referencing provisional draft-zubov-snif-05; it remains caller-owned at v0.178.0 and does not admit draft authority or runtime code. The DNS Parameters update dated 2026-08-04 changes only three existing references from drafts to RFC 10029 and RFC 10023, adds no allocation, remains caller-owned at v0.188.0, and does not admit either RFC into Brynja protocol scope. On 2026-08-11 final Standards Track RFC 10024 and the official TLS Parameters XML were independently retrieved and reviewed: the registry changes only the three final ECDHE-ML-KEM group and two obsoleted Kyber draft references from draft metadata to RFC 10024. RFC 10024 has no reported errata and adding it changes no existing errata record. The former admission blocker is resolved for planned v0.164.0 implementation; no protocol code is admitted at this refresh. Later on 2026-08-11 the official DNS Parameters XML added only the `_x402` TXT underscored service name referencing provisional draft-hawkins-x402-dns-discovery-01; it remains caller-owned at v0.188.0, does not admit draft authority or runtime code, and is included only to preserve complete registry coverage. The later 2026-08-11 TLS ExtensionType update allocates certificate type value 4 to C509 Certificate under provisional draft-ietf-cose-cbor-encoded-cert-20 and moves the unassigned range start to 5; the allocation remains future work, the draft is not admitted as normative authority, and no runtime code is admitted by this refresh. On 2026-08-17 the official final SP 800-185 publication page and PDF were reviewed and the exact PDF was pinned for pre-1.0 cSHAKE, KMAC, TupleHash and ParallelHash planning; NIST's 2025 decision to revise the document remains an explicit lifecycle-monitor input and admits no unpublished revision text. Later on 2026-08-17 verified editorial RFC 9954 erratum 9136 was retrieved and reviewed: it corrects two TLS 1.3 section references from 4.2.8 to 4.3.8, changes no normative hybrid-key-exchange behavior, remains an explicit implementation input for planned v0.161.0, and admits no runtime code in this refresh."
latest_pin_provenance = "On 2026-08-28 the official IANA SMI Numbers and DNS Parameters XML files plus the complete locked-RFC errata set were independently retrieved and reviewed. SMI advances two MAC-address references to RFC 10031 and adds provisional id-rdna-c509Name value 2; existing PKIX/OCSP ownership at v0.89.0 is unchanged. DNS adds provisional UNECE/ISO RR types, the RFC 8460 _tls underscored TXT name, a temporary provisional DELEG parameter, and schema-only NOTIFY mnemonic normalization; existing caller-owned v0.188.0 disposition is unchanged. Reported technical RFC 3986 erratum 9147 remains track-not-applied and cannot alter requirements. On 2026-08-31 the v0.24.5 lifecycle monitor detected newly reported editorial RFC 9846 erratum 9157. Official review confirms that it capitalizes two Appendix F.1 references to the defined Main Secret, remains unverified and track-not-applied, changes no TLS behavior or requirement, and is owned by the existing TLS 1.3 milestones. On 2026-09-03 the v0.24.11 release gate detected newly reported technical RFC 9846 erratum 9161. Official review confirms that it distinguishes the syntactically permitted empty CertificateRequest extension vector from the conforming sender requirement to include signature_algorithms, remains unverified and track-not-applied, changes no wire rule or sender requirement, and is owned by the existing TLS 1.3 milestones. No referenced draft, RFC, unverified erratum, authority state, or runtime code is admitted by these evidence refreshes. On 2026-09-06 RFC Editor and IETF plaintext RFC 1321 copies were cross-checked byte-for-byte for the explicit v0.24.19 legacy MD5 implementation. Only its index entry and seven historical errata were added; existing index entries were unchanged. Verified 551/585 correct round-index notation, 552 is wording, and 550/553 correct the unused C test driver. Held 6193 concerns its timing division and is tracked, not applied; rejected 7814 cannot alter authority. Brynja uses first-party fixed-width Rust, not that C reference. This local source review is not independent cryptographic verification; exceptional implementation pentest remains pending."
