[workspace]
[package]
name = "brynja-in-place-sha2-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"

[features]
general = ["brynja-hash-sha2/general-sha512-t"]
execution = ["brynja-hash-sha2/hardened-execution"]
hosted = ["execution", "brynja-hash-sha2/runtime-execution", "dep:brynja-crypto-cpu-std"]

[dependencies]
brynja-hash-sha2 = { path = "../../../crates/brynja-hash-sha2", default-features = false }
brynja-crypto-cpu-std = { path = "../../../crates/brynja-crypto-cpu-std", default-features = false, features = ["runtime-execution"], optional = true }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
