[workspace]

[package]
name = "brynja-register-cleanup-prototype"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# Calling-convention evidence, not native Windows qualification.
win64-probe = []
# Select the separate SHA/SSE2 or NEON/SHA2 compression boundary.
sha256-probe = []
keccak-probe = []
batch256-probe = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
