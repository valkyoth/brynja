[workspace]

[package]
name = "brynja-general-sha512-t-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
brynja-hash-sha2 = { path = "../../crates/brynja-hash-sha2", version = "=0.1.0", default-features = false, features = ["general-sha512-t"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
panic = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
