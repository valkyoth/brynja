[schema]
version = 4
milestone = "0.24.4"
status = "sha2-and-keccak-candidates-with-scalar-decisions"

[limits]
# These counts govern the original candidate/session dispatch paths. The
# default-off raw static_execution API has its own reviewed source closure in
# static-cpu-execution-reviewed.json and does not alter these old admissions.
maximum_source_lines = 500
implemented_backend_count = 7
active_backend_count = 0
approved_cpu_low_level_allowances = 8

[packages.kernel]
name = "brynja-crypto-cpu"
version = "0.2.0"
runtime = "no_std"
dependencies = []
default_features = []
publication = "deferred-crates-io"
facade_feature = "cpu"

[packages.detector]
name = "brynja-crypto-cpu-std"
version = "0.2.0"
runtime = "std"
dependencies = ["brynja-crypto-cpu", "brynja-hash-sha2", "brynja-hash-sha3", "brynja-core", "brynja-mac-kmac", "brynja-hash-tuple"]
default_features = []
publication = "deferred-crates-io"
facade_feature = "none"

[graph]
scalar_owners = ["brynja-hash-sha2", "brynja-hash-sha3"]
facade = "brynja"
forbidden_consumers = [
  "brynja-tls",
  "brynja-tls12",
  "brynja-tls13",
  "brynja-tls13-handshake",
  "brynja-dtls",
  "brynja-quic-tls",
  "brynja-legacy",
]
third_party_detection_crates = "forbidden"
build_time_source_inclusion = "forbidden"
implicit_std = "forbidden"
os_entropy_and_platform_services = "forbidden"

[fips]
future_module = "brynja-fips-module"
ordinary_facade_claim = "forbidden"
detector_adapter = "excluded"
feature_unification_changes_artifact = "forbidden"
kernel_inclusion = "exact-reviewed-symbols-only"
dispatch_table = "artifact-owned"
operational_environment = "artifact-owned"

[low_level_boundary]
current_cpu_allowances = [
  "brynja-crypto-cpu:src/sha256.rs:runtime-attestation",
  "brynja-crypto-cpu:src/x86_sha.rs:sha-intrinsics",
  "brynja-crypto-cpu:src/aarch64_sha2.rs:sha2-intrinsics",
  "brynja-crypto-cpu:src/riscv64_zknh.rs:zknh-inline-assembly",
  "brynja-crypto-cpu:src/keccak.rs:runtime-attestation",
  "brynja-crypto-cpu:src/x86_avx2_keccak.rs:avx2-intrinsics",
  "brynja-crypto-cpu:src/aarch64_sha3_keccak.rs:sha3-intrinsics",
  "brynja-crypto-cpu-std:src/runtime_detection.rs:std-feature-attestation",
]
approval_scope = "one-exact-symbol"
amendment_requires = [
  "primitive-and-operation",
  "source-symbol-and-sha256",
  "compiler-and-feature-bundle",
  "instruction-preconditions",
  "abi-and-vector-state-preconditions",
  "safe-wrapper-invariants",
  "register-and-spill-residuals",
  "scalar-reference",
  "known-answer-test",
  "quarantine-path",
  "native-hardware-evidence",
  "side-channel-evidence",
  "performance-evidence",
  "fips-disposition",
  "independent-review",
]
forbidden_mechanisms = [
  "foreign-abi",
  "external-assembly",
  "native-object",
  "build-script",
  "generated-source-inclusion",
  "global-registry",
]

[safe_wrapper]
invariants = [
  "exact-backend-identity",
  "complete-feature-bundle",
  "architecture-match-before-kat",
  "compile-time-proof-or-reviewed-runtime-detection",
  "thread-bound-caller-owned-session",
  "successful-direct-kat",
  "permanent-session-quarantine",
  "health-check-before-state-mutation",
  "exact-one-block-bounds",
  "scalar-differential-equivalence",
  "actual-backend-reporting",
  "opportunistic-only-scalar-fallback",
  "required-mode-fails-closed",
  "secret-free-failure",
  "no-register-erasure-claim",
]

