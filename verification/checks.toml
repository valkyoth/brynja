# Scoped portable and selected sanitizer checks. Remaining native/proof/hosted
# assessments retain their historical catalog; registration is not evidence.
schema = 1
execution_semantics = 1
catalog = "verification/catalog.json"
includes = ["verification/miri-checks.json", "verification/kani-checks.json", "verification/matrix-checks.json", "verification/extra-checks.json"]



# Development-only raw round kernels: no public dispatch or qualification.
[groups.aes-kernel-candidate]
paths = ["crates/brynja-crypto-cpu/src/aes", "assurance/aes-kernel-candidate", "crates/brynja-crypto/tests/fixtures/aes128", "crates/brynja-crypto/tests/fixtures/aes192", "crates/brynja-crypto/tests/fixtures/aes256", "scripts/aes/check-aes-kernel-candidate.py", "scripts/aes/test-aes-kernel-candidate.py"]
[[groups.aes-kernel-candidate.tools]]
program = "python3"
[groups.aes-kernel-qemu]
[[groups.aes-kernel-qemu.tools]]
program = "qemu-aarch64"

[[checks]]
component = "aes"
id = "kernel-x86-msrv"
category = "kernel-candidate"
name = "AES round candidates x86 on Rust 1.90.0"
establishes = "Internal round candidate correctness only: 2078 NIST KAT records and 768 alignment/canary combinations, both directions and all widths. Native x86 AES-NI, not public acceleration, startup admission, lifecycle, timing, spill erasure or native platform qualification. Test-only expansion; production portable APIs unchanged."
command = ["python3","scripts/aes/check-aes-kernel-candidate.py","--toolchain","1.90.0"]
cwd = "."
inputs = ["aes-kernel-candidate","hkdf-msrv"]
environment = { RUSTUP_AUTO_INSTALL = "0" }
reject_environment = ["PYTHONOPTIMIZE", "PYTHONPATH", "RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "RUSTDOCFLAGS", "CARGO_BUILD_TARGET", "RUSTC", "RUSTDOC", "RUSTC_WRAPPER", "RUSTC_WORKSPACE_WRAPPER", "RUSTUP_TOOLCHAIN"]
platform = "linux-x86_64"
timeout_seconds = 600
[checks.success]
contains = ["test result: ok. 5 passed; 0 failed; 0 ignored;", "AES kernel candidate PASS"]
minimum_tests = 5
exact_tests = 5
unique_lines = ["AES_KERNEL_KAT_PASS: 128:568", "AES_KERNEL_KAT_PASS: 192:700", "AES_KERNEL_KAT_PASS: 256:810", "AES_KERNEL_ALIGNMENT_PASS: 768"]

