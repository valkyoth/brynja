[package]
name = "brynja-ghash-timing"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[features]
aws-counter-window = ["brynja-crypto/cpu"]
pclmul-screen = ["brynja-crypto/cpu"]
pmull-screen = ["brynja-crypto/cpu"]
rv64-screen = ["brynja-crypto/cpu"]

[[bin]]
name = "amd-counters"
path = "src/bin/amd-counters.rs"
required-features = ["pclmul-screen"]

[[bin]]
name = "aws-counters"
path = "src/bin/aws-counters.rs"
required-features = ["aws-counter-window"]

[[bin]]
name = "pmull-order"
path = "src/bin/pmull-order.rs"
required-features = ["pmull-screen"]

[[bin]]
name = "rv64-branches"
path = "src/bin/rv64-branches.rs"
required-features = ["rv64-screen"]

[dependencies]
brynja-crypto = { path = "../../crates/brynja-crypto", default-features = false, features = ["hazmat-ghash"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"
