[release]
version = "0.20.0"
milestone = "0.20.0"
baseline = "0.15.0"
cumulative_milestones = ["0.16.0", "0.17.0", "0.18.0", "0.18.1", "0.19.0", "0.20.0"]
policy = "independent"
stage = "public"
exceptional = false
exception_reason = ""

[crates."brynja"]
previous_version = "0.19.0"
version = "0.20.0"
change = "code"
publish = true
reason = "Publish the cumulative v0.15.0-to-v0.20.0 checkpoint with bounded DER framing after its scheduled pentest, green hosted checks, and explicit authorization."

[crates."brynja-core"]
previous_version = "0.8.0"
version = "0.9.0"
change = "code"
publish = true
reason = "Publish cumulative pending-operation, FIPS-aware, mandatory-outcome, and observational-event foundations added after v0.15.0."

[crates."brynja-crypto"]
previous_version = "0.1.1"
version = "0.1.2"
change = "dependency"
publish = true
reason = "Publish the exact brynja-core 0.9.0 dependency update; cryptographic effects remain unimplemented."

[crates."brynja-crypto-cpu"]
previous_version = "0.1.0"
version = "0.1.1"
change = "metadata"
publish = true
reason = "Publish cumulative documentation for the inert CPU-kernel boundary; no executable backend is admitted."

[crates."brynja-crypto-cpu-std"]
previous_version = "0.1.0"
version = "0.1.1"
change = "dependency"
publish = true
reason = "Publish the exact brynja-crypto-cpu 0.1.1 dependency update; no runtime detector is implemented."

[crates."brynja-pki"]
previous_version = "0.1.7"
version = "0.2.0"
change = "code"
publish = true
reason = "Publish the first bounded allocation-free DER identifier, length, value, and constructed-nesting reader without claiming ASN.1 or X.509 semantics."

[crates."brynja-protocol"]
previous_version = "unpublished"
version = "0.1.0"
change = "initial"
publish = true
reason = "Publish the initial shared no_std TLS and DTLS record-framing crate accumulated at v0.19.0 and remediated after its exceptional pentest."

[crates."brynja-tls"]
previous_version = "0.1.7"
