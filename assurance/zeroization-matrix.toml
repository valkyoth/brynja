[schema]
version = 1
milestone = "0.11.0"

[claim]
scope = "complete-exclusively-borrowed-rust-allocation"
method = "per-byte-volatile-zero-store-plus-compiler-barrier"
unsafe_module = "crates/brynja-core/src/secret_memory_volatile.rs"
artifacts = ["mir", "llvm-ir", "assembly"]

[coverage]
compilers = [
  "1.90.0",
  "1.91.0",
  "1.92.0",
  "1.93.0",
  "1.94.0",
  "1.95.0",
  "1.96.0",
  "1.96.1",
  "1.97.0",
  "1.97.1",
]
compiler_target = "x86_64-unknown-linux-gnu"
target_compiler = "1.97.1"
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
  "x86_64-apple-darwin",
  "aarch64-linux-android",
  "aarch64-apple-ios",
  "thumbv7em-none-eabi",
  "riscv32imac-unknown-none-elf",
  "x86_64-unknown-none",
]

[dynamic]
toolchain = "nightly-2026-08-12"
miri = true
address_sanitizer = true
test_target = "x86_64-unknown-linux-gnu"

[exclusions]
values = [
  "registers",
  "caller-or-compiler-created-copies",
  "cpu-caches",
  "device-caches",
  "dma-visible-copies",
  "crash-dumps",
  "suspend-images",
  "physical-memory-remanence",
  "concurrent-access",
  "mem-forget-or-process-termination",
]
