negative_test = "scripts/hash/test-final-acceptance.py#main"
work_bound = "Absorb work is linear in complete input blocks and squeeze work is linear in caller-requested output blocks; both byte domains use checked u128 accumulation, and output is written only after length admission."
evidence_gap = "All six FIPS 202 SHA-3/SHAKE identities are fully implemented across ordinary byte, canonical arbitrary-bit, sealed hardened public/secret, fixed-output and incremental-XOF profiles with official vectors, domain-separation, differential, proof, sanitization, compiler-artifact, package-external and combined acceptance evidence. Both CPU candidates remain unadmitted, RISC-V Keccak remains scalar-only, and qualifying native performance, migration, side-channel, independent-review, and FIPS-validation evidence remains incomplete."
residual = "NIST announced a future FIPS 202 update; the pinned 2015 final remains current but must be re-reviewed when a draft or final appears."
mapping_rationale = "The SHA-3 and SHAKE semantic surface directly records the complete algorithm family admitted from the pinned current FIPS 202 authority."

