[package]
name = "brynja-legacy-hmac-hosted-cleanup"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
brynja-core = { path = "../../crates/brynja-core", default-features = false }
brynja-legacy-sha1 = { path = "../../crates/brynja-legacy-sha1", default-features = false }
brynja-legacy-md5 = { path = "../../crates/brynja-legacy-md5", default-features = false }
brynja-legacy-hmac-std = { path = "../../crates/brynja-legacy-hmac-std", default-features = false, features = ["strict-sha1-acceleration", "macos-resident-sha1-acceleration", "strict-md5-batch", "macos-resident-md5-batch"] }
