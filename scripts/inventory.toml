[layout]
root_files = ["README.md", "checks.sh", "inventory.toml", "tag_gate.sh"]
entrypoints = ["checks.sh", "tag_gate.sh"]

[category.assurance]
extensions = [".py", ".sh"]
purpose = "Shared bounded assurance runners, bare-metal gates, and proof orchestration"

[category.ci]
extensions = [".lock", ".sh"]
purpose = "Pinned CI tools and Rust-version matrix checks"

[category.constant-time]
extensions = [".py", ".sh"]
purpose = "Constant-time source and compiler-artifact assurance"

[category.cpu]
extensions = [".py", ".sh"]
purpose = "Reusable CPU capability, dispatch, admission, and evidence infrastructure"

[category.cryptography]
extensions = [".py", ".sh"]
purpose = "Cross-algorithm API profiles, secret-state closure, and composition policy"

[category.foundations]
extensions = [".py", ".sh"]
purpose = "Provider and security-foundation contract policies and tests"

[category.hash]
extensions = [".py", ".sh", ".toml"]
purpose = "Cross-family hash final acceptance and closure policy"

[category.kmac]
extensions = [".py", ".sh"]
purpose = "KMAC and KMACXOF implementation, package acceptance, and differential evidence"

[category.pki]
extensions = [".py"]
purpose = "DER and canonical ASN.1 policy and tests"

[category.parallelhash]
extensions = [".py", ".sh"]
purpose = "ParallelHash and ParallelHashXOF implementation, scheduling, package, and differential evidence"

[category.protocols]
extensions = [".py"]
purpose = "Protocol framing and state-machine policy and tests"

[category.release]
extensions = [".py", ".sh"]
purpose = "Release, pentest, publication, SBOM, and GitHub-control tooling"

[category.repository]
extensions = [".py", ".sh"]
purpose = "Repository source, metadata, documentation, status, and script-layout policy"

[category.sanitization]
extensions = [".py", ".sh"]
purpose = "Sanitization dependency and compiler-artifact assurance"

[category.sha2]
extensions = [".py", ".sh"]
purpose = "SHA-2 implementation, public acceptance, and architecture-specific evidence"

[category.sha1]
extensions = [".py", ".sh", ".toml"]
purpose = "Isolated legacy SHA-1 conformance, cleanup, package acceptance, and differential assurance"

[category.sha3]
extensions = [".py", ".sh"]
purpose = "SHA-3 and SHAKE implementation, public acceptance, and differential evidence"

[category.sp800185]
extensions = [".py", ".toml"]
purpose = "Combined portable SP 800-185 public API acceptance and closure policy"

[category.tuplehash]
extensions = [".py", ".sh"]
purpose = "TupleHash and TupleHashXOF implementation, package acceptance, and differential evidence"

[category.standards]
extensions = [".py", ".sh"]
purpose = "Standards authorities, protocol surfaces, and normative requirements"

[category.zeroization]
extensions = [".py", ".sh"]
purpose = "Zeroization source and compiler-artifact assurance"
