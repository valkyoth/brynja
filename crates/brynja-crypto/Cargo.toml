[package]
name = "brynja-crypto"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cryptographic provider, policy, and composition layer for Brynja"
publish = ["crates-io"]
include = ["Cargo.toml","LICENSE-APACHE","LICENSE-MIT","README.md","src/**/*.rs","tests/**/*.rs","tests/fixtures/aes128/*","tests/fixtures/aes192/*","tests/fixtures/aes256/*"]

[features]
default = []
chacha20poly1305 = ["dep:brynja-aead-chacha20poly1305"]
chacha20poly1305-x86 = ["chacha20poly1305", "brynja-aead-chacha20poly1305/chacha20poly1305-x86"]
chacha20poly1305-neon = ["chacha20poly1305", "brynja-aead-chacha20poly1305/chacha20poly1305-neon"]
poly1305 = ["dep:brynja-mac-poly1305"]
aes-gcm = ["dep:brynja-aead-gcm", "brynja-aead-gcm/aes-gcm"]
aes-gcm-execution = ["aes-gcm", "brynja-aead-gcm/aes-gcm-execution"]
gmac = ["dep:brynja-aead-gcm", "brynja-aead-gcm/gmac"]
gmac-execution = ["gmac", "brynja-aead-gcm/gmac-execution"]
hazmat-aes-block = ["dep:brynja-cipher-aes", "brynja-cipher-aes/hazmat-aes-block"]
hazmat-chacha20 = ["dep:brynja-cipher-chacha", "brynja-cipher-chacha/hazmat-chacha20"]
hazmat-ghash = ["dep:brynja-universal-hash-ghash", "brynja-universal-hash-ghash/hazmat-ghash"]
ghash-runtime-execution = ["hazmat-ghash", "brynja-universal-hash-ghash/ghash-runtime-execution", "dep:brynja-crypto-cpu", "brynja-crypto-cpu/ghash-runtime-execution"]
aes-static-execution = ["hazmat-aes-block", "cpu", "brynja-cipher-aes/aes-static-execution"]
aes-runtime-execution = ["aes-static-execution", "brynja-cipher-aes/aes-runtime-execution"]
external-key-provider = ["dep:brynja-cipher-aes", "brynja-cipher-aes/external-key-provider"]
hmac-hardened-execution = ["cpu", "brynja-mac-hmac/hardened-execution"]
hmac-runtime-execution = ["cpu", "brynja-mac-hmac/runtime-execution"]
cpu = ["dep:brynja-crypto-cpu", "brynja-universal-hash-ghash?/cpu"]
general-sha512-t = ["brynja-hash-sha2/general-sha512-t"]
sha2-static-execution = ["cpu", "brynja-hash-sha2/static-execution"]
sha2-runtime-execution = ["cpu", "brynja-hash-sha2/runtime-execution"]
sha2-hardened-execution = ["cpu", "brynja-hash-sha2/hardened-execution"]
sha256-batch = ["cpu", "brynja-hash-sha2/batch-execution"]
sha512-batch = ["cpu", "brynja-hash-sha2/batch512-execution"]
sha256-hardened-batch = ["cpu", "brynja-hash-sha2/hardened-batch-execution"]
sha512-hardened-batch = ["cpu", "brynja-hash-sha2/hardened-batch512-execution"]
sha3-static-execution = ["cpu", "brynja-hash-sha3/static-execution"]
sha3-runtime-execution = ["cpu", "brynja-hash-sha3/runtime-execution"]
sha3-hardened-execution = ["cpu", "brynja-hash-sha3/hardened-execution"]
keccak-batch = ["cpu", "brynja-hash-sha3/batch-execution"]
keccak-hardened-batch = ["cpu", "brynja-hash-sha3/hardened-batch-execution"]
kmac-hardened-execution = ["cpu", "brynja-mac-kmac/hardened-execution"]
kmac-runtime-execution = ["cpu", "brynja-mac-kmac/runtime-execution"]
tuplehash-hardened-execution = ["cpu", "brynja-hash-tuple/hardened-execution"]
tuplehash-runtime-execution = ["cpu", "brynja-hash-tuple/runtime-execution"]
parallelhash-hardened-execution = ["cpu", "brynja-hash-parallel/hardened-execution"]
parallelhash-runtime-execution = ["cpu", "brynja-hash-parallel/runtime-execution"]
parallelhash-hardened-batch = ["cpu", "brynja-hash-parallel/hardened-batch-execution"]

[dependencies]
brynja-aead-chacha20poly1305 = { workspace = true, optional = true }
brynja-mac-poly1305 = { workspace = true, optional = true }
brynja-aead-gcm = { workspace = true, optional = true }
brynja-universal-hash-ghash = { workspace = true, optional = true }
brynja-cipher-aes = { workspace = true, optional = true }
brynja-cipher-chacha = { workspace = true, optional = true }
brynja-core = { workspace = true }
brynja-crypto-cpu = { workspace = true, optional = true }
brynja-hash-sha2 = { workspace = true }
brynja-hash-sha3 = { workspace = true }
brynja-hash-tuple = { workspace = true }
brynja-hash-parallel = { workspace = true }
brynja-mac-kmac = { workspace = true }
brynja-mac-hmac = { workspace = true }

[lints]
workspace = true

[[test]]
name = "chacha20"
required-features = ["hazmat-chacha20"]

[[test]]
name = "aead_pair"
required-features = ["aes-gcm-execution", "gmac-execution"]

[[test]]
name = "ghash_field"
required-features = ["hazmat-ghash"]

[[test]]
name = "ghash_lifecycle"
required-features = ["hazmat-ghash"]

[[test]]
name = "aes_execution"
required-features = ["aes-static-execution"]

[[test]]
name = "aes_riscv"
required-features = ["aes-static-execution"]

[[test]]
name = "aes_wide"
required-features = ["hazmat-aes-block"]

[[test]]
name = "aes_wide_kat"
required-features = ["hazmat-aes-block"]

[[test]]
name = "aes_wide_differential"
required-features = ["hazmat-aes-block"]

[[test]]
name = "aes128"
required-features = ["hazmat-aes-block"]

[[test]]
name = "aes128_differential"
required-features = ["hazmat-aes-block"]

[[test]]
name = "aes128_provider"
required-features = ["hazmat-aes-block", "external-key-provider"]

[[test]]
name = "aes192_provider"
required-features = ["hazmat-aes-block", "external-key-provider"]

[[test]]
name = "aes256_provider"
required-features = ["hazmat-aes-block", "external-key-provider"]
