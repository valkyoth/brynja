[package]
name = "brynja-aes-timing"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
brynja-crypto = { path = "../../crates/brynja-crypto", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"
