[package]
name = "brynja-crypto-cpu"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Optional no_std CPU acceleration boundary for Brynja cryptography"
publish = ["crates-io"]

[features]
default = []
static-execution = []
runtime-execution = ["static-execution"]
hardened-execution = ["static-execution", "dep:brynja-core"]

[dependencies]
brynja-core = { workspace = true, optional = true }

[lints]
workspace = true
