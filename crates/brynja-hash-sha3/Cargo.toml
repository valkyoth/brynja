[package]
name = "brynja-hash-sha3"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "First-party no_std SHA-3 and SHAKE implementations for Brynja"
publish = ["crates-io"]

[features]
default = []
cpu = ["dep:brynja-crypto-cpu"]
static-execution = ["cpu", "brynja-crypto-cpu/static-execution"]
runtime-execution = ["static-execution", "brynja-crypto-cpu/runtime-execution"]
hardened-execution = ["static-execution", "brynja-crypto-cpu/hardened-execution"]

[dependencies]
brynja-core = { workspace = true }
brynja-hash-core = { workspace = true }
brynja-crypto-cpu = { workspace = true, optional = true }

[lints]
workspace = true
