[[checks]]
component = "hkdf"
id = "timing-screen"
category = "timing"
name = "Modern HKDF bounded host timing diagnostic"
establishes = "Synthetic fixed-zero versus fixed-FF secrets at equal public lengths; 36 campaigns, 512 paired samples, four requests per measurement, balanced AB/BA order on one allowed logical CPU. Independent Python HMAC preflight checks both classes before measurement. Includes PRK admission and owner cleanup; raw samples and alarms retained. Paired-t threshold 10 is a diagnostic alarm, not constant-time, cache, cross-target, statistical security or release qualification. No automatic retry."
command = ["python3", "scripts/hkdf/check-hkdf-timing.py", "modern"]
cwd = "."
inputs = ["compiler","hkdf-timing","hkdf-composition","hash-core","sha2-source","sha3-source","hmac-source","kmac-source","tuplehash-source","parallelhash-source"]
environment = { RUSTUP_AUTO_INSTALL = "0" }
reject_environment = ["RUSTFLAGS", "CARGO_ENCODED_RUSTFLAGS", "RUSTC", "RUSTC_WRAPPER", "RUSTC_WORKSPACE_WRAPPER", "CARGO_BUILD_TARGET"]
platform = "linux-x86_64"
timeout_seconds = 900
log_bytes = 16777216
[checks.success]
unique_lines = ["Independent HKDF timing preflight: PASS", "HKDF modern timing screen: 36 campaigns; 512 pairs; 4 repetitions; zero alarms", "Observation only; not constant-time, cache, cross-target or independent qualification"]
contains = ["HKDF modern timing screen: 36 campaigns; 512 pairs; 4 repetitions; zero alarms"]

