[workspace]

[package]
name = "brynja-aes-public-api-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
default = []
direct = ["dep:brynja-crypto"]
facade = ["dep:brynja"]

[dependencies]
brynja-crypto = { path = "../../crates/brynja-crypto", default-features = false, optional = true }
brynja = { path = "../../crates/brynja", default-features = false, optional = true }

[[test]]
name = "consumer"
path = "tests/consumer.rs"

[profile.release]
overflow-checks = true
