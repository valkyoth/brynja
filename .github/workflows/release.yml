name: Release Metadata Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release metadata
        run: scripts/release/validate-release-metadata.sh
      - name: Validate independent crate release plan
        run: scripts/release/release_crates.py --check
      - name: Require committed pentest report
        run: scripts/release/validate-current-pentest.sh --required
