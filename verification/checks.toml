[[checks]]
component = "hkdf"
id = "asan-derivation"
category = "asan"
name = "Modern HKDF asan derivation"
establishes = "8 existing vector/bounds/lifecycle tests under ASan/LSan. No exhaustive dynamic analysis, native backend, whole-frame erasure or constant-time claim."
command = ["cargo","+nightly-2026-09-11","test","--locked","--offline","--target","x86_64-unknown-linux-gnu","-p","brynja-crypto","--no-default-features","--test","hkdf_derivation"]
cwd = "."
inputs = ["asan-tools","hkdf-composition","hash-core","sha2-source","sha3-source","hmac-source","kmac-source","tuplehash-source","parallelhash-source","hkdf-derivation"]
environment = { RUSTFLAGS = "-Zsanitizer=address", CARGO_ENCODED_RUSTFLAGS = "", ASAN_OPTIONS = "detect_leaks=1:halt_on_error=1:exitcode=1", LSAN_OPTIONS = "exitcode=23", CARGO_TARGET_DIR = "target/hkdf-asan", RUSTUP_AUTO_INSTALL = "0" }
reject_environment = ["RUSTFLAGS","CARGO_ENCODED_RUSTFLAGS","RUSTDOCFLAGS","CARGO_BUILD_TARGET","RUSTC","RUSTC_WRAPPER","RUSTC_WORKSPACE_WRAPPER","ASAN_OPTIONS","LSAN_OPTIONS"]
platform = "linux-x86_64"
timeout_seconds = 1800
[checks.success]
contains = ["test result: ok."]
minimum_tests = 8
exact_tests = 8

