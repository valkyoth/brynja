schema = 1
domain = "transport-exceptions"

[[requirement]]
domain = "tls"
id = "BRY-REQ-TLS-0005"
owner = "0.5.0"
lifecycle = "evidenced"
decision_ids = ["iana.tls-parameters.tls-parameters-6"]
sources = [
  { id = "rfc:6066", authority_role = "current" },
  { id = "rfc:9846", authority_role = "current" },
]
statement = "TLS alerts, close outcomes, local failures, provider failures, and exhaustion remain typed, non-secret, and protocol-version aware."
invariants = ["failure-atomicity", "resource-bound", "validation", "version-separation"]
target = "crates/brynja-core/src/error.rs#TlsFailure"
positive_test = "crates/brynja-core/tests/tls_failures.rs#typed_outcomes"
negative_test = "crates/brynja-core/tests/tls_failures.rs#reject_secret_and_ambiguous_errors"
work_bound = "Failure construction, alert selection, formatting prohibition, cancellation, and cleanup consume fixed or explicitly bounded work."
evidence = ["security/pentest/v0.5.0.md#Findings"]
evidence_gap = "The scoped tests and release pentest are complete; independent protocol review, interoperability, and engine evidence remain outside this value-domain claim."
residual = "Wire emission and protocol state transitions remain owned by their version-specific engines and later verification milestones."
mapping_rationale = "The shared TLS failure semantic surface owns the pre-implementation taxonomy used by every later transport engine while preserving exact version-specific wire behavior."

[[requirement]]
domain = "tls"
id = "BRY-REQ-TLS-0019"
owner = "0.19.0"
lifecycle = "implemented"
decision_ids = ["iana.tls-parameters.tls-parameters-5"]
sources = [{ id = "rfc:9846", authority_role = "current" }]
statement = "TLS wire identifiers use closed typed domains, preserve unknown values where required, and deny unsupported values without ambiguous coercion."
invariants = ["canonical-encoding", "resource-bound", "validation", "version-separation"]
target = "crates/brynja-protocol/src/tls/content_type.rs#WirePolicy"
positive_test = "crates/brynja-protocol/tests/wire_policy.rs#every_content_type_byte_is_preserved_without_coercion"
negative_test = "crates/brynja-protocol/tests/wire_policy.rs#inner_content_is_closed_and_heartbeat_is_never_admitted"
work_bound = "Identifier parsing, lookup, preservation, context checks, and failure selection are bounded by the enclosing message and registry domain."
evidence_gap = "Record-level ContentType projection and local tests are implemented; the staged normative lifecycle still requires later tested and evidenced promotions."
residual = "Individual algorithms and facilities remain unavailable until their owning milestone changes the corresponding future-work decision."
mapping_rationale = "The shared TLS wire-policy surface governs registry representation and fail-closed dispatch before individual version-specific protocol facilities are implemented."

[[requirement]]
domain = "tls"
id = "BRY-REQ-TLS-0018"
owner = "0.148.1"
lifecycle = "planned"
decision_ids = ["facility.heartbeat"]
sources = [{ id = "rfc:6520", authority_role = "current" }]
statement = "TLS and DTLS Heartbeat is implemented completely for every applicable version through explicit bounded opt-in policy and remains disabled by default."
invariants = ["resource-bound", "validation", "version-separation"]
target = "crates/brynja-tls/src/heartbeat.rs#HeartbeatFacility"
positive_test = "tests/requirements/heartbeat.rs#complete_opt_in_client_server_profiles"
negative_test = "tests/requirements/heartbeat.rs#length_disclosure_amplification_and_default_rejection"
work_bound = "Payload, padding, response, rate, amplification, path and aggregate work are bounded before echo or output mutation."
evidence_gap = "Complete TLS/DTLS version, role, resumption, path, resource and interoperability evidence remains unresolved until v0.148.1."
residual = "Heartbeat remains unsuitable as implicit application liveness and is never enabled by a modern default."
mapping_rationale = "RFC 6520 defines a real standardized facility, so v0.148.1 owns its complete opt-in implementation rather than recognition-only rejection."

[[requirement]]
domain = "tls13"
id = "BRY-REQ-TLS13-0046"
owner = "0.82.4"
lifecycle = "planned"
decision_ids = ["algorithm.legacy-pkcs1-client-signature"]
sources = [{ id = "rfc:9963", authority_role = "current" }]
statement = "Legacy RSASSA-PKCS1-v1_5 client CertificateVerify code points are fully implemented for their exact TLS 1.3 client role through explicit server compatibility policy."
invariants = ["algorithm-admission", "resource-bound", "validation", "version-separation"]
target = "crates/brynja-tls13-handshake/src/signature.rs#LegacyClientPkcs1"
positive_test = "tests/requirements/tls13_legacy_client_signature.rs#client_sign_server_verify"
negative_test = "tests/requirements/tls13_legacy_client_signature.rs#role_scheme_and_default_rejection"
work_bound = "Negotiation, certificate selection, signing, verification and transcript work share the fixed TLS 1.3 handshake and RSA limits."
evidence_gap = "Complete role, certificate, signature, transcript, interop and isolation evidence remains unresolved until v0.82.4."
residual = "The code points remain absent from server signatures and modern defaults despite complete explicit compatibility."
mapping_rationale = "RFC 9963 defines an exact compatibility capability owned by v0.82.4 over the sole legacy RSA implementation."

[[requirement]]
domain = "tls13"
id = "BRY-REQ-TLS13-0721"
owner = "0.82.2"
lifecycle = "planned"
decision_ids = ["facility.tls13.post-handshake-authentication"]
sources = [{ id = "rfc:9846", authority_role = "current" }]
statement = "TLS 1.3 post-handshake authentication is completely implemented in both roles through explicit opt-in policy."
invariants = ["key-lifecycle", "resource-bound", "validation", "version-separation"]
target = "crates/brynja-tls13-handshake/src/authentication.rs#PostHandshakeAuthentication"
positive_test = "tests/requirements/tls13_post_handshake_auth.rs#complete_client_server_flow"
negative_test = "tests/requirements/tls13_post_handshake_auth.rs#ordering_context_concurrency_and_default_rejection"
work_bound = "Requests, transcripts, credentials, concurrent states and aggregate post-handshake work have explicit connection-scoped ceilings."
evidence_gap = "Complete configuration, role, ordering, transcript, KeyUpdate, resumption, cancellation and interop evidence remains unresolved until v0.82.2."
residual = "The facility remains disabled by default and cannot silently grant renewed application authorization."
mapping_rationale = "The TLS 1.3 authority defines a real optional state machine, so v0.82.2 owns its complete explicit implementation."

[[requirement]]
domain = "tls13"
id = "BRY-REQ-TLS13-0763"
owner = "0.82.3"
lifecycle = "planned"
decision_ids = ["facility.external-psk.certificate-authentication"]
sources = [{ id = "rfc:9973", authority_role = "current" }]
statement = "Certificate authentication combined with an external TLS 1.3 PSK is implemented as a complete explicitly selected authentication mode."
invariants = ["algorithm-admission", "key-lifecycle", "resource-bound", "validation", "version-separation"]
target = "crates/brynja-tls13/src/psk.rs#CertificateExternalPskMode"
positive_test = "tests/requirements/tls13_certificate_psk.rs#complete_client_server_flow"
negative_test = "tests/requirements/tls13_certificate_psk.rs#credential_role_importer_and_fallback_failures"
work_bound = "Binder, certificate, signature, Finished, PSK lookup and provisional state use existing bounded handshake and pending-operation ceilings."
evidence_gap = "Complete binder, certificate, role, importer, resumption, early-data, privacy and interop evidence remains unresolved until v0.82.3."
residual = "The combined mode remains explicit and cannot substitute for certificate-only or PSK-only authentication."
mapping_rationale = "RFC 9973 defines a complete combined mode owned by v0.82.3 rather than an exclusion surface."

[[requirement]]
domain = "quic"
id = "BRY-REQ-QUIC-0093"
owner = "0.94.0"
lifecycle = "caller-owned"
decision_ids = ["iana.quic.quic-frame-types"]
sources = [{ id = "rfc:9000", authority_role = "caller-owned" }]
statement = "QUIC packet, frame, stream, recovery, congestion, Retry, migration, and transport-state semantics remain owned by the caller."
invariants = ["resource-bound", "validation", "version-separation", "work-bound"]
target = "boundary:quic-transport-owned"
positive_test = "tests/requirements/quic_ownership.rs#typed_transport_boundary"
negative_test = "tests/requirements/quic_ownership.rs#reject_transport_semantic_claims"
work_bound = "Brynja accepts only bounded ordered handshake bytes and typed transport inputs; transport processing cannot consume Brynja state implicitly."
evidence_gap = "Executable API-boundary, feature-graph, packet-injection, recovery, version, and integration tests remain unresolved until v0.94.0."
residual = "The caller must provide a correct and separately reviewed QUIC transport, loss-recovery, congestion-control, and path implementation."
mapping_rationale = "RFC 9000 and the caller-owned QUIC frame registry establish the explicit transport boundary around Brynja's recordless TLS adapter."
