# Portable hash/MAC harness catalog. Native/proof/hosted assessments retain
# their historical catalog; registration does not establish current coverage.
schema = 1
execution_semantics = 1

[groups.hash-core]
paths = ["crates/brynja-core/src", "crates/brynja-hash-core/src"]

[groups.hash-core.toml]
"Cargo.toml" = ["workspace.package.edition", "workspace.package.rust-version", "workspace.lints", "profile.dev", "profile.test", "workspace.dependencies.brynja-core.path", "workspace.dependencies.brynja-hash-core.path"]
"crates/brynja-core/Cargo.toml" = ["package.name", "package.edition", "package.rust-version", "lib", "features.default", "dependencies", "lints"]
"crates/brynja-hash-core/Cargo.toml" = ["package.name", "package.edition", "package.rust-version", "lib", "features.default", "dependencies", "lints"]

[[groups.hash-core.locks]]
path = "Cargo.lock"
packages = ["brynja-core", "brynja-hash-core"]

[groups.compiler]
[[groups.compiler.tools]]
program = "rustc"
toolchain = "1.99.1"
[[groups.compiler.tools]]
program = "cargo"
toolchain = "1.99.1"

[groups.md5-api]
paths = ["crates/brynja-legacy-md5/src", "crates/brynja-legacy-md5/tests/api.rs", "crates/brynja-legacy-md5/tests/vectors/rfc1321.txt"]
[groups.md5-api.toml]
"crates/brynja-legacy-md5/Cargo.toml" = ["package.name", "package.edition", "package.rust-version", "package.build", "lib", "test", "features.default", "dependencies", "dev-dependencies", "build-dependencies", "lints"]
[[groups.md5-api.locks]]
path = "Cargo.lock"
packages = ["brynja-legacy-md5"]

[groups.sha1-api]
paths = ["crates/brynja-legacy-sha1/src", "crates/brynja-legacy-sha1/tests/api.rs", "crates/brynja-legacy-sha1/tests/vectors/nist.txt"]
[groups.sha1-api.toml]
"crates/brynja-legacy-sha1/Cargo.toml" = ["package.name", "package.edition", "package.rust-version", "package.build", "lib", "test", "features.default", "dependencies", "dev-dependencies", "build-dependencies", "lints"]
[[groups.sha1-api.locks]]
path = "Cargo.lock"
packages = ["brynja-legacy-sha1"]

[[checks]]
component = "md5"
id = "known-answers"
name = "RFC vectors, ordinary/hardened/streaming"
establishes = "Existing RFC 1321 byte vectors on portable owners; not SIMD or native-backend qualification."
command = ["cargo", "+1.99.1", "test", "--locked", "--offline", "-p", "brynja-legacy-md5", "--no-default-features", "--test", "api", "official_rfc_vectors_ordinary_hardened_and_streamed", "--", "--exact"]
cwd = "."
inputs = ["hash-core", "compiler", "md5-api", "md5-source"]
timeout_seconds = 600
[checks.success]
contains = ["test official_rfc_vectors_ordinary_hardened_and_streamed ... ok", "test result: ok. 1 passed; 0 failed; 0 ignored;"]
minimum_tests = 1

# Portable harness registrations. Source groups are reusable, test inputs stay
