[schema]
version = 1
milestone = "0.24.15"
surface_register_sha256 = "2bd27839397277980c1c297f7db91e84e79c61364c2eda328af4b504332e8f3e"

[api]
dimensions = [
  "operation-direction",
  "byte-input",
  "bit-input",
  "one-shot",
  "incremental-state",
  "fixed-output",
  "extendable-output",
  "verification",
  "buffers",
  "overlap",
  "ownership",
  "provider",
  "backend",
  "no-std",
  "hosted-adapter",
  "import",
  "export",
  "generation",
  "reset",
  "clone",
  "snapshot",
  "cancellation",
]
dispositions = [
  "required",
  "forbidden",
  "not-applicable",
  "caller-owned",
  "internal-only",
  "optional-isolated",
]

[cleanup]
mandatory_core_symbol = "crates/brynja-core/src/secret_memory_volatile.rs#zeroize_region_volatile"
mandatory_core_evidence = "scripts/zeroization/check-zeroization-codegen.sh"
optional_adapter_symbol = "crates/brynja-sanitization/src/lib.rs#SanitizedSecret"
optional_adapter_evidence = "scripts/sanitization/check-sanitization-adapter-codegen.sh"
adapter_required_for_core = false
adapter_in_fips_graph = false
adjacent_failure_policy = "attempt-every-region-and-latch-terminal-failure"
recoverable_unwind_policy = "non-panicking-drop-cleans-every-owned-region"

[lifecycle]
edges = [
  "creation",
  "success",
  "error",
  "cancellation",
  "replacement",
  "rekey",
  "failed-construction",
  "recoverable-unwind",
  "drop",
]

[output]
classifications = [
  "explicit-public-declassification",
  "public-non-secret",
  "typed-secret-owned",
  "no-output",
]
partial_failure_policies = [
  "unchanged-destination",
  "clear-complete-secret-destination",
  "not-applicable",
]
verification_policies = [
  "before-output-release",
  "after-authentication",
  "not-applicable",
]

[residual]
risks = [
  "mem-forget",
  "process-abort",
  "forced-termination",
  "power-loss",
  "register-copies",
  "cpu-caches",
  "compiler-created-copies",
  "crash-dumps",
  "suspend-images",
  "os-swap-and-paging",
  "dma-visible-copies",
  "physical-memory-remanence",
]

[rejection]
values = [
  "copy-secret-state",
  "clone-secret-state",
  "format-secret-state",
  "serialize-secret-state",
  "raw-secret-state-access",
  "snapshot-secret-state",
  "reset-secret-into-ordinary-state",
  "downstream-hardened-marker-implementation",
  "downstream-hardened-marker-forgery",
  "optional-only-core-cleanup",
  "partial-secret-output-without-clearing",
  "unreviewed-secret-accelerated-backend",
  "implicit-secret-output-declassification",
  "unsafe-convenience-api",
  "nonstandard-convenience-api",
]

