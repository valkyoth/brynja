[package]
name = "brynja-mac-poly1305"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable no_std RFC 8439 one-time Poly1305 authenticator for Brynja"
publish = ["crates-io"]
include = ["Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "README.md", "src/**/*.rs", "tests/vectors.rs", "tests/data/rfc8439.tsv"]

[features]
default = []
poly1305-avx2 = ["dep:brynja-crypto-cpu", "brynja-crypto-cpu/poly1305-avx2"]
poly1305-rvv = ["dep:brynja-crypto-cpu", "brynja-crypto-cpu/poly1305-rvv"]
poly1305-neon = ["dep:brynja-crypto-cpu", "brynja-crypto-cpu/poly1305-neon"]

[dependencies]
brynja-core = { workspace = true }

[target.'cfg(any(all(target_arch = "riscv64", target_os = "linux"), all(target_arch = "x86_64", target_os = "linux"), all(target_arch = "aarch64", any(target_os = "linux", target_os = "macos"))))'.dependencies]
brynja-crypto-cpu = { workspace = true, optional = true }

[lints]
workspace = true
