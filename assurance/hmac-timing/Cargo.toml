[package]
name = "brynja-hmac-timing"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
brynja-mac-hmac = { path = "../../crates/brynja-mac-hmac", default-features = false, features = ["hardened-execution"] }
brynja-crypto-cpu-std = { path = "../../crates/brynja-crypto-cpu-std", default-features = false, features = ["hmac-execution", "strict-hmac-acceleration", "macos-resident-hmac-acceleration"] }
