[package]
name = "brynja-crypto-cpu-std"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in host CPU-detection boundary for Brynja cryptography"
publish = ["crates-io"]

[features]
default = []
protected-memory = ["dep:brynja-core"]
strict-batch = ["protected-memory", "sha256-hardened-batch", "sha512-hardened-batch", "keccak-hardened-batch", "brynja-hash-sha2/general-sha512-t"]
strict-sha2 = ["protected-memory", "brynja-hash-sha2/general-sha512-t"]
strict-sha2-acceleration = ["strict-sha2", "brynja-hash-sha2/hardened-execution"]
strict-sha3 = ["protected-memory", "dep:brynja-hash-sha3"]
strict-sha3-acceleration = ["strict-sha3", "brynja-hash-sha3/hardened-execution"]
strict-kmac = ["protected-memory", "dep:brynja-mac-kmac"]
strict-kmac-acceleration = ["strict-kmac", "brynja-mac-kmac/hardened-execution"]
strict-tuplehash = ["protected-memory", "dep:brynja-hash-tuple"]
strict-tuplehash-acceleration = ["strict-tuplehash", "brynja-hash-tuple/hardened-execution"]
sha256-hardened-batch = ["brynja-crypto-cpu/sha256-hardened-batch", "brynja-hash-sha2/hardened-batch-execution"]
sha512-hardened-batch = ["brynja-crypto-cpu/sha512-hardened-batch", "brynja-hash-sha2/hardened-batch512-execution"]
keccak-hardened-batch = ["brynja-crypto-cpu/keccak-hardened-batch", "dep:brynja-hash-sha3", "brynja-hash-sha3/hardened-batch-execution"]
keccak-batch = ["brynja-crypto-cpu/keccak-batch", "dep:brynja-hash-sha3", "brynja-hash-sha3/batch-execution"]
sha512-batch = ["brynja-crypto-cpu/sha512-batch", "brynja-hash-sha2/batch512-execution"]
sha256-batch = ["brynja-crypto-cpu/sha256-batch", "brynja-hash-sha2/batch-execution"]
runtime-execution = ["brynja-crypto-cpu/runtime-execution"]
sponge-execution = ["runtime-execution", "dep:brynja-hash-sha3", "brynja-hash-sha3/runtime-execution"]

[dependencies]
brynja-core = { workspace = true, optional = true }
brynja-crypto-cpu = { workspace = true }
brynja-hash-sha2 = { workspace = true, features = ["cpu"] }
brynja-hash-sha3 = { workspace = true, optional = true }
brynja-mac-kmac = { workspace = true, optional = true }
brynja-hash-tuple = { workspace = true, optional = true }

[lints]
workspace = true
