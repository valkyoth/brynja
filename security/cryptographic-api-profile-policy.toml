forbidden = ["operation-direction", "byte-input", "bit-input", "one-shot", "incremental-state", "fixed-output", "extendable-output", "verification", "buffers", "overlap", "ownership", "provider", "backend", "no-std", "hosted-adapter", "import", "export", "generation", "reset", "clone", "snapshot", "cancellation"]
