[package]
name = "brynja-legacy-hmac"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Explicit legacy-only HMAC-SHA-1 and HMAC-MD5 compatibility"
publish = ["crates-io"]
include = ["Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "README.md", "src/*.rs"]

[features]
default = []

[dependencies]
brynja-core.workspace = true
brynja-legacy-sha1 = { path = "../brynja-legacy-sha1", version = "=0.1.0", default-features = false }
brynja-legacy-md5 = { path = "../brynja-legacy-md5", version = "=0.1.0", default-features = false }

[lints]
workspace = true
