[schema]
version = 1
milestone = "0.4.0"

[toolchains]
release = "1.97.1"
msrv = "1.90.0"
kani = "1.90.0-x86_64-unknown-linux-gnu"

[harness]
protocol = "brynja-stdin-json-v1"
maximum_input_bytes = 1048576
maximum_output_bytes = 1048576
maximum_cases = 4096
timeout_milliseconds = 5000
shell_execution = false
deterministic_replay = true
network_isolation = "external-sandbox-required"
input_class = "public-test-data-only"
automatic_failure_persistence = false
process_tree_termination = "hostile-posix-external-containment-windows-job"
corpus_input = "descriptor-bound-no-follow-limit-plus-one-streaming"

[mutation]
runner = "scripts/assurance_mutation.py"
algorithm = "brynja-deterministic-mutation-v1"
operators = [
  "empty",
  "original",
  "truncate",
  "delete-byte",
  "flip-bit",
  "insert-zero",
  "insert-ff",
]

[differential]
runner = "scripts/assurance_differential.py"
minimum_independent_implementations = 2
result_fields = ["class", "output"]
result_classes = ["accept", "reject", "unsupported"]
canonical_json = true

[[bare_metal_targets]]
triple = "thumbv7em-none-eabi"
architecture = "armv7e-m"
class = "os-less"
features = "all"

[[bare_metal_targets]]
triple = "riscv32imac-unknown-none-elf"
architecture = "riscv32imac"
class = "os-less"
features = "all"

[[bare_metal_targets]]
triple = "x86_64-unknown-none"
architecture = "x86_64"
class = "os-less"
features = "all"

