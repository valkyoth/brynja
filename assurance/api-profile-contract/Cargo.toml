[workspace]

[package]
name = "brynja-api-profile-contract-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
brynja-core = { path = "../../crates/brynja-core", version = "=0.9.0" }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "deny"

[lints.clippy]
panic = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
undocumented_unsafe_blocks = "forbid"
indexing_slicing = "forbid"
arithmetic_side_effects = "forbid"
