name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format lint test policy and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show
      - name: Install OS-less Rust targets
        run: rustup target add riscv32imac-unknown-none-elf thumbv7em-none-eabi x86_64-unknown-none
      - name: Install SHA CPU codegen targets
        run: rustup target add aarch64-unknown-linux-gnu riscv64gc-unknown-linux-gnu
      - name: Install SHA CPU MSRV codegen toolchain
        run: >
          rustup toolchain install 1.90.0 --profile minimal
          --target aarch64-unknown-linux-gnu,riscv64gc-unknown-linux-gnu
      - name: Install security and SBOM tools
        run: scripts/ci/install-ci-tools.sh
      - name: Run repository gate
        run: scripts/checks.sh
      - name: Validate protected release controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-github-release-controls.py --public
      - name: Check dependency policy
        run: cargo deny check
      - name: Check RustSec advisories
        run: cargo audit --deny warnings
      - name: Verify committed SBOM
        run: scripts/release/generate-sbom.sh --check

  host:
    name: Host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            expected_backend: x86-sha
          - os: ubuntu-24.04-arm
            expected_backend: aarch64-sha2
          - os: macos-latest
            expected_backend: aarch64-sha2
          - os: windows-latest
            expected_backend: x86-sha
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        shell: bash
        run: scripts/ci/ci_install_rust.sh
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Exercise detected SHA-256 candidate without granting admission
        env:
          BRYNJA_CPU_EVIDENCE_EXPECTED_BACKEND: ${{ matrix.expected_backend }}
          RUSTFLAGS: --cfg brynja_cpu_evidence
        run: cargo test -p brynja-crypto-cpu-std
      - name: Run SHA-256 public API acceptance
        run: python scripts/sha2/check-sha256-public-api.py
      - name: Run complete SHA-2 public API acceptance
        run: python scripts/sha2/check-sha2-public-api.py
      - name: Run SHA-2 arbitrary-bit differential oracle
        run: python scripts/sha2/check-sha2-bit-differential.py
      - name: Run complete SHA-3/SHAKE portable public API acceptance
        run: python scripts/sha3/check-sha3-public-api.py
      - name: Run complete cSHAKE public API acceptance
        run: cargo test --locked --manifest-path assurance/cshake-public-api/Cargo.toml
      - name: Run combined hash final acceptance
        run: python scripts/hash/check-final-acceptance.py
      - name: Run SHA-3/SHAKE arbitrary-bit differential acceptance
        run: python scripts/sha3/check-sha3-bit-differential.py
      - name: Lint SHA-3/SHAKE public API fixture
        run: >
          cargo clippy --locked
          --manifest-path assurance/sha3-public-api/Cargo.toml
          --all-targets --
          -A clippy::chunks_exact_to_as_chunks
          -D warnings
      - name: Run SP 800-185 parallel execution acceptance
        run: cargo run --quiet --locked --manifest-path assurance/sp800185-final/Cargo.toml
      - name: Test assurance platform boundary
        run: python scripts/assurance/test-assurance.py
      - name: Test CPU evidence admission boundary
        run: python scripts/cpu/test-cpu-evidence.py

  rust-version:
    name: Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: [1.90.0, 1.91.0, 1.92.0, 1.93.0, 1.94.0, 1.95.0, 1.96.0, 1.96.1, 1.97.0, 1.97.1, 1.98.0, 1.98.1]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Check complete workspace
        run: cargo +${{ matrix.rust }} check --workspace --all-features
      - name: Check CPU admission fixture
        run: cargo +${{ matrix.rust }} check --manifest-path assurance/cpu-admission-fixture/Cargo.toml
      - name: Run SHA-256 public API acceptance
        run: cargo +${{ matrix.rust }} run --quiet --locked --manifest-path assurance/sha256-public-api/Cargo.toml
      - name: Run complete SHA-2 public API acceptance
        run: cargo +${{ matrix.rust }} run --quiet --locked --manifest-path assurance/sha2-public-api/Cargo.toml
      - name: Run complete SHA-3/SHAKE portable public API acceptance
        run: cargo +${{ matrix.rust }} run --quiet --locked --manifest-path assurance/sha3-public-api/Cargo.toml
      - name: Run complete cSHAKE public API acceptance
        run: cargo +${{ matrix.rust }} test --quiet --locked --manifest-path assurance/cshake-public-api/Cargo.toml
      - name: Run combined hash final acceptance
        run: cargo +${{ matrix.rust }} run --quiet --locked --manifest-path assurance/hash-final-acceptance/Cargo.toml
      - name: Run portable SP 800-185 public API acceptance
        run: cargo +${{ matrix.rust }} run --quiet --locked --manifest-path assurance/sp800185-public-api/Cargo.toml
      - name: Run SP 800-185 parallel execution acceptance
        run: cargo +${{ matrix.rust }} run --quiet --locked --manifest-path assurance/sp800185-final/Cargo.toml
      - name: Verify zeroization emitted code
        run: scripts/zeroization/check-zeroization-codegen.sh "${{ matrix.rust }}" x86_64-unknown-linux-gnu
      - name: Verify constant-time emitted code
        run: scripts/constant-time/check-constant-time-codegen.sh "${{ matrix.rust }}" x86_64-unknown-linux-gnu

  target:
    name: no_std target (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-unknown-freebsd
          - x86_64-apple-darwin
          - aarch64-linux-android
          - aarch64-apple-ios
          - thumbv7em-none-eabi
          - riscv32imac-unknown-none-elf
          - x86_64-unknown-none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Check complete no_std workspace
        run: cargo check --workspace --exclude brynja-crypto-cpu-std --exclude brynja-hash-parallel-std --all-features --target ${{ matrix.target }}
      - name: Check CPU admission fixture
        run: cargo check --manifest-path assurance/cpu-admission-fixture/Cargo.toml --target ${{ matrix.target }}
      - name: Check SHA-256 public API fixture
        run: cargo check --locked --manifest-path assurance/sha256-public-api/Cargo.toml --lib --target ${{ matrix.target }}
      - name: Check complete SHA-2 public API fixture
        run: cargo check --locked --manifest-path assurance/sha2-public-api/Cargo.toml --lib --target ${{ matrix.target }}
      - name: Check complete SHA-3/SHAKE public API fixture
        run: cargo check --locked --manifest-path assurance/sha3-public-api/Cargo.toml --lib --target ${{ matrix.target }}
      - name: Check complete cSHAKE public API fixture
        run: cargo check --locked --manifest-path assurance/cshake-public-api/Cargo.toml --lib --target ${{ matrix.target }}
      - name: Check combined hash final acceptance fixture
        run: cargo check --locked --manifest-path assurance/hash-final-acceptance/Cargo.toml --lib --target ${{ matrix.target }}
      - name: Check portable SP 800-185 public API fixture
        run: cargo check --locked --manifest-path assurance/sp800185-public-api/Cargo.toml --lib --target ${{ matrix.target }}
      - name: Verify zeroization emitted code
        run: scripts/zeroization/check-zeroization-codegen.sh 1.98.1 "${{ matrix.target }}"
      - name: Verify constant-time emitted code
        run: scripts/constant-time/check-constant-time-codegen.sh 1.98.1 "${{ matrix.target }}"
