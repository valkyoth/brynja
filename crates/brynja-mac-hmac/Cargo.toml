[package]
name = "brynja-mac-hmac"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "First-party no_std HMAC construction over Brynja hardened hash owners"
publish = ["crates-io"]
include = ["Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "README.md", "src/**/*.rs"]

[features]
default = []

[dependencies]
brynja-core.workspace = true
brynja-hash-sha2 = { workspace = true, features = ["general-sha512-t"] }
brynja-hash-sha3.workspace = true

[lints]
workspace = true
