[schema]
version = 1

[packages.brynja]
class = "modern-facade"
publish = "crates-io"
required = ["brynja-core", "brynja-crypto", "brynja-pki", "brynja-protocol", "brynja-tls"]
optional = { dtls = "brynja-dtls", platform = "brynja-platform", quic = "brynja-quic-tls" }

[packages.brynja-strict]
class = "host-adapter"
publish = "crates-io"
required = ["brynja-crypto-cpu-std", "brynja-hash-parallel-std"]
optional = {}
features = ["acceleration"]

[packages.brynja-legacy-sha1-std]
class = "host-adapter"
publish = "crates-io"
required = ["brynja-legacy-sha1"]
optional = { strict-execution = ["brynja-core", "brynja-crypto-cpu-std"] }
features = ["runtime-execution", "runtime-hardened-execution"]

[packages.brynja-legacy-md5-std]
class = "host-adapter"
publish = "crates-io"
required = ["brynja-legacy-md5"]
optional = { strict-execution = ["brynja-core", "brynja-crypto-cpu-std"] }

[packages.brynja-core]
class = "modern-shared"
publish = "crates-io"
required = []
optional = {}

[packages.brynja-legacy-hkdf]
class = "legacy-engine"
publish = "crates-io"
required = ["brynja-core", "brynja-legacy-hmac"]
optional = {}

[packages.brynja-legacy-hmac]
class = "legacy-engine"
publish = "crates-io"
required = ["brynja-core", "brynja-legacy-sha1", "brynja-legacy-md5"]
optional = {}

[packages.brynja-legacy-hmac-std]
class = "legacy-engine"
publish = "crates-io"
required = ["brynja-core", "brynja-legacy-hmac"]
optional = { strict-execution = "brynja-crypto-cpu-std" }

[packages.brynja-crypto]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-parallel", "brynja-hash-sha2", "brynja-hash-sha3", "brynja-hash-tuple", "brynja-mac-kmac", "brynja-mac-hmac"]
optional = { cpu = "brynja-crypto-cpu", hazmat-chacha20 = "brynja-cipher-chacha", hazmat-aes-block = "brynja-cipher-aes", hazmat-ghash = "brynja-universal-hash-ghash", aes-gcm = "brynja-aead-gcm", gmac = "brynja-aead-gcm", poly1305 = "brynja-mac-poly1305" }

[packages.brynja-aead-gcm]
class = "modern-shared"
publish = "crates-io"
required = []
[packages.brynja-aead-gcm.optional]
aes-gcm = ["brynja-core", "brynja-cipher-aes", "brynja-universal-hash-ghash"]
gmac = ["brynja-core", "brynja-cipher-aes", "brynja-universal-hash-ghash"]
aes-gcm-execution = "brynja-crypto-cpu"
gmac-execution = "brynja-crypto-cpu"

[packages.brynja-universal-hash-ghash]
class = "modern-shared"
publish = "crates-io"
required = []
optional = { hazmat-ghash = "brynja-core", cpu = "brynja-crypto-cpu" }
features = ["ghash-runtime-execution", "__mode", "__mode-execution"]

[packages.brynja-cipher-aes]
class = "modern-shared"
publish = "crates-io"
required = []
optional = { hazmat-aes-block = "brynja-core", aes-static-execution = "brynja-crypto-cpu" }
features = ["external-key-provider", "aes-runtime-execution", "__mode", "__mode-execution"]

[packages.brynja-cipher-chacha]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core"]
optional = { chacha20-sse2 = "brynja-crypto-cpu", chacha20-neon = "brynja-crypto-cpu" }
features = ["hazmat-chacha20"]

[packages.brynja-hash-core]
class = "modern-shared"
publish = "crates-io"
required = []
optional = {}

[packages.brynja-hash-sha2]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-core"]
optional = { cpu = "brynja-crypto-cpu" }
features = ["general-sha512-t", "static-execution", "runtime-execution", "hardened-execution", "batch-execution"]

[packages.brynja-hash-sha3]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-core"]
optional = { cpu = "brynja-crypto-cpu" }
features = ["static-execution", "runtime-execution", "hardened-execution"]

[packages.brynja-hash-tuple]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-sha3"]
optional = {}

[packages.brynja-hash-parallel]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-sha3"]
optional = {}
dev = ["brynja-crypto-cpu", "brynja-crypto-cpu-std"]
features = ["hardened-execution", "runtime-execution"]

[packages.brynja-hash-parallel-std]
class = "host-adapter"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-parallel"]
optional = { runtime-execution = ["brynja-crypto-cpu-std", "brynja-crypto-cpu"] }
features = ["strict-execution"]

[packages.brynja-mac-kmac]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-sha3"]
optional = {}
features = ["conformance-testing", "hardened-execution", "runtime-execution"]

[packages.brynja-mac-poly1305]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core"]
optional = {}

[packages.brynja-mac-hmac]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-sha2", "brynja-hash-sha3"]
optional = { hardened-execution = "brynja-crypto-cpu" }
features = ["runtime-execution"]

[packages.brynja-crypto-cpu]
class = "cpu-backend"
publish = "crates-io"
required = []
optional = { hardened-execution = "brynja-core" }
features = ["static-execution", "runtime-execution", "sha256-batch", "chacha20-sse2", "chacha20-neon"]

[packages.brynja-crypto-cpu-std]
class = "host-adapter"
publish = "crates-io"
required = ["brynja-crypto-cpu", "brynja-hash-sha2"]
optional = { sponge-execution = "brynja-hash-sha3", protected-memory = "brynja-core", strict-kmac = "brynja-mac-kmac", strict-tuplehash = "brynja-hash-tuple", hmac-execution = "brynja-mac-hmac" }
features = ["runtime-execution", "sha256-batch"]

[packages.brynja-pki]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core"]
optional = {}

[packages.brynja-protocol]
class = "modern-shared"
publish = "crates-io"
required = ["brynja-core"]
optional = {}

[packages.brynja-platform]
class = "platform-adapter"
publish = "crates-io"
required = []
optional = {}

[packages.brynja-tls13-handshake]
class = "modern-shared"
publish = "crates-io"
required = []
optional = {}

[packages.brynja-tls12]
class = "modern-engine"
publish = "crates-io"
required = []
optional = {}

[packages.brynja-tls13]
class = "modern-engine"
publish = "crates-io"
required = ["brynja-tls13-handshake"]
optional = {}

[packages.brynja-tls]
class = "modern-router"
publish = "crates-io"
required = ["brynja-tls12", "brynja-tls13"]
optional = {}

[packages.brynja-dtls]
class = "modern-engine"
publish = "crates-io"
required = []
optional = {}

[packages.brynja-quic-tls]
class = "protocol-adapter"
publish = "crates-io"
required = ["brynja-tls13-handshake"]
optional = {}

[packages.brynja-sanitization]
class = "security-adapter"
publish = "crates-io"
required = ["brynja-core", "sanitization"]
optional = {}

[packages.brynja-legacy]
class = "legacy-facade"
publish = "blocked"
required = []
optional = { pct = "brynja-legacy-pct", snp = "brynja-legacy-snp", ssl2 = "brynja-legacy-ssl2", ssl3 = "brynja-legacy-ssl3", tls10 = "brynja-legacy-tls10", tls11 = "brynja-legacy-tls11", wtls = "brynja-legacy-wtls" }

[packages.brynja-legacy-md5]
class = "legacy-engine"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-core"]
optional = {}
features = ["batch", "cpu", "cpu-evidence"]

[packages.brynja-legacy-sha1]
class = "legacy-engine"
publish = "crates-io"
required = ["brynja-core", "brynja-hash-core"]
optional = {}
features = ["cpu", "cpu-evidence", "execution", "hardened-execution"]

[packages.brynja-legacy-pct]
class = "legacy-engine"
publish = "blocked"
required = []
optional = {}

[packages.brynja-legacy-snp]
class = "legacy-engine"
publish = "blocked"
required = []
optional = {}

[packages.brynja-legacy-ssl2]
class = "legacy-engine"
publish = "blocked"
required = []
optional = {}

[packages.brynja-legacy-ssl3]
class = "legacy-engine"
publish = "blocked"
required = []
optional = {}

[packages.brynja-legacy-tls10]
class = "legacy-engine"
publish = "blocked"
required = []
optional = {}

[packages.brynja-legacy-tls11]
class = "legacy-engine"
publish = "blocked"
required = []
optional = {}

[packages.brynja-legacy-wtls]
class = "legacy-engine"
publish = "blocked"
required = []
optional = {}

[packages.brynja-interop]
class = "repository-only"
publish = "never"
required = []
optional = {}

[packages.brynja-proofs]
class = "repository-only"
publish = "never"
required = []
optional = {}

[packages.brynja-research-ssl1]
class = "research-only"
publish = "never"
required = []
optional = {}

[packages.brynja-test-support]
class = "repository-only"
publish = "never"
required = ["brynja-core"]
optional = {}

[packages.brynja-xtask]
class = "repository-only"
publish = "never"
required = []
optional = {}
