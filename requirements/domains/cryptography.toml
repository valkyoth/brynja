[[requirement]]
id = "BRY-REQ-CRYPTO-0001"
owner = "0.22.0"
lifecycle = "implemented"
revision = 10
decision_ids = ["algorithm.sha2"]
sources = [{ id = "nist:NIST.FIPS.180-4.pdf", authority_role = "current" }, { id = "nist:NIST.SP.800-107r1.pdf", authority_role = "current" }, { id = "riscv:RISCV.Crypto.Scalar-1.0.1.pdf", authority_role = "current" }, { id = "riscv:RISCV.Crypto.Vector-1.0.pdf", authority_role = "current" }]
statement = "SHA-224, SHA-256, SHA-384, SHA-512, SHA-512/224, and SHA-512/256 follow the pinned secure-hash algorithms, distinct initial values and output rules, length domains, and approved hash-use constraints; any RISC-V acceleration uses only an exact ratified cryptographic extension and preserves those semantics."
invariants = ["constant-time", "resource-bound", "side-channel", "work-bound"]
target = "crates/brynja-hash-sha2/src/lib.rs#SHA512_256_IMPLEMENTED"
positive_test = "scripts/hash/check-final-acceptance.py#main"
negative_test = "scripts/hash/test-final-acceptance.py#main"
work_bound = "Processing work is linear in complete input blocks with checked bit-length accumulation and deterministic exhaustion."
evidence_gap = "All six FIPS 180-4 SHA-2 identities are fully implemented across ordinary byte, canonical arbitrary-bit, and sealed hardened public/secret profiles with normative IVs, official vectors, streaming, exhaustion, differential, proof, sanitization, compiler-artifact, package-external and combined acceptance evidence. All five CPU candidates remain unadmitted, x86 SHA-512 is scalar-only, and qualifying native performance, migration, side-channel, independent-review, and FIPS-validation evidence remains incomplete."
residual = "The announced future revisions of FIPS 180-4 and SP 800-107 must be reviewed before implementation freeze; vector Zvknha and Zvknhb remain unimplemented."
mapping_rationale = "The SHA-2 semantic surface is governed by the pinned NIST hash authorities; the ratified RISC-V publications govern only optional acceleration of that same implementation."

