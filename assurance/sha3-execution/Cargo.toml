[workspace]

[package]
name = "brynja-sha3-execution-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
brynja-hash-sha3 = { path = "../../crates/brynja-hash-sha3", version = "=0.1.0", features = ["runtime-execution"] }
brynja-crypto-cpu-std = { path = "../../crates/brynja-crypto-cpu-std", version = "=0.1.1", features = ["sponge-execution"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
