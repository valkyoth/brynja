[package]
name = "brynja-historical"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "Explicit facade for isolated historical transport-security protocols"
publish = false

[features]
default = []
tls11 = ["dep:brynja-historical-tls11"]
tls10 = ["dep:brynja-historical-tls10"]
ssl3 = ["dep:brynja-historical-ssl3"]
ssl2 = ["dep:brynja-historical-ssl2"]
wtls = ["dep:brynja-historical-wtls"]
pct = ["dep:brynja-historical-pct"]
snp = ["dep:brynja-historical-snp"]

[dependencies]
brynja-historical-tls11 = { workspace = true, optional = true }
brynja-historical-tls10 = { workspace = true, optional = true }
brynja-historical-ssl3 = { workspace = true, optional = true }
brynja-historical-ssl2 = { workspace = true, optional = true }
brynja-historical-wtls = { workspace = true, optional = true }
brynja-historical-pct = { workspace = true, optional = true }
brynja-historical-snp = { workspace = true, optional = true }

[lints]
workspace = true
