[workspace]

[package]
name = "brynja-sha2-execution-fixture"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
brynja-hash-sha2 = { path = "../../crates/brynja-hash-sha2", version = "=0.1.0", default-features = false, features = ["general-sha512-t", "runtime-execution"] }
brynja-crypto-cpu-std = { path = "../../crates/brynja-crypto-cpu-std", version = "=0.1.1", default-features = false, features = ["runtime-execution"] }
brynja-general-sha512-t-consumer = { path = "../general-sha512-t" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
