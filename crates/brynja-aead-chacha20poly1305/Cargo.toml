[package]
name = "brynja-aead-chacha20poly1305"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable no_std RFC 8439 ChaCha20-Poly1305 authenticated encryption"
publish = ["crates-io"]
include = ["Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "README.md", "src/**/*.rs"]

[features]
default = []

[dependencies]
brynja-core.workspace = true
brynja-cipher-chacha = { workspace = true, features = ["hazmat-chacha20"] }
brynja-mac-poly1305.workspace = true

[lints]
workspace = true
