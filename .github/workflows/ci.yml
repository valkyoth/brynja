name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hkdf-public-api:
    name: Packaged HKDF public API acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install acceptance endpoints and bare-metal target
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target thumbv7em-none-eabi
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target thumbv7em-none-eabi
      - name: Fetch locked workspace dependencies before offline acceptance
        run: cargo +1.99.1 fetch --locked
      - name: Test runner rejection controls
        run: python3 scripts/hkdf/test-hkdf-public-api.py
      - name: Check consumer formatting and lint
        run: |
          cargo +1.99.1 fmt --manifest-path assurance/hkdf-public-api/Cargo.toml --check
          cargo +1.99.1 fmt --manifest-path assurance/legacy-hkdf-public-api/Cargo.toml --check
          cargo +1.99.1 clippy --locked --offline --manifest-path assurance/hkdf-public-api/Cargo.toml --all-targets --no-deps -- -D warnings
          cargo +1.99.1 clippy --locked --offline --manifest-path assurance/legacy-hkdf-public-api/Cargo.toml --all-targets --no-deps -- -D warnings
      - name: Exercise only packaged public HKDF consumers
        run: python3 scripts/hkdf/check-hkdf-public-api.py

  checks:
    name: Format lint test policy and audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show
      - name: Show the finite component checks (no execution)
        run: python3 scripts/release/scoped_release.py --ci --list
      - name: Fetch locked workspace dependencies for offline metadata checks
        run: cargo fetch --locked
      - name: Run the agreed component and integration checks
        run: python3 scripts/release/scoped_release.py --ci

  audit:
    name: Dependency audit and release controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup show
      - name: Install security and SBOM tools
        run: scripts/ci/install-ci-tools.sh
      - name: Validate protected release controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/check-github-release-controls.py --public
      - name: Check dependency policy
        run: cargo deny check
      - name: Check RustSec advisories
        run: cargo audit --deny warnings
      - name: Check standalone verification-tool advisories
        run: cargo audit --file tools/brynja-verify/Cargo.lock --deny warnings
      - name: Verify committed SBOM
        run: scripts/release/generate-sbom.sh --check
