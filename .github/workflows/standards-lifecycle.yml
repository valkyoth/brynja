name: Standards Lifecycle Monitor

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    name: Observe official authority lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate committed lifecycle baseline
        run: python3 scripts/standards/check-authority-lifecycle.py
      - name: Observe official authority state
        run: >
          python3 scripts/standards/observe-authority-lifecycle.py
          --artifact "${{ runner.temp }}/authority-lifecycle-observation.json"
      - name: Preserve bounded observation artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authority-lifecycle-observation
          path: ${{ runner.temp }}/authority-lifecycle-observation.json
          if-no-files-found: error
          retention-days: 30
