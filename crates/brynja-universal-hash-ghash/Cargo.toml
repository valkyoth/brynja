[package]
name = "brynja-universal-hash-ghash"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in no_std GHASH over framed blocks for Brynja"
publish = ["crates-io"]
include = ["Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "README.md", "src/**/*.rs"]

[features]
default = []
__mode = ["dep:brynja-core"]
__mode-execution = ["__mode", "dep:brynja-crypto-cpu", "brynja-crypto-cpu/ghash-runtime-execution"]
hazmat-ghash = ["dep:brynja-core"]
ghash-runtime-execution = ["hazmat-ghash", "dep:brynja-crypto-cpu", "brynja-crypto-cpu/ghash-runtime-execution"]
cpu = ["dep:brynja-crypto-cpu"]

[dependencies]
brynja-core = { workspace = true, optional = true }
brynja-crypto-cpu = { workspace = true, optional = true }

[lints]
workspace = true
